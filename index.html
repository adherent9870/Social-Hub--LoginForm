<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Hub</title>
    <script src="script.js" defer></script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Light theme (Sky + White) */
        --bg-1: #f4faff;
        --bg-2: #eaf6ff;
        --cloud-1: rgba(147, 197, 253, 0.35);
        --cloud-2: rgba(125, 211, 252, 0.35);

        --primary: #0ea5e9; /* sky-500 */
        --primary-600: #0284c7; /* sky-600 */
        --text: #0f172a; /* slate-900 */
        --muted: #475569; /* slate-600 */

        --wrap-bg: rgba(255, 255, 255, 0.35);
        --wrap-border: rgba(148, 163, 184, 0.15);

        --card: #ffffff;
        --border: #e6effa;

        --input-bg: #ffffff;
        --input-border: #e5effa;
        --input-placeholder: #9db4d1;

        --heading: #0b2f53;
        --status: #0369a1;

        --radius: 16px;
        --shadow-lg: 0 24px 60px rgba(2, 132, 199, 0.1),
          0 8px 24px rgba(2, 8, 23, 0.06);
        --ring: 0 0 0 4px rgba(14, 165, 233, 0.2);
      }

      /* Dark theme overrides */
      :root[data-theme="dark"] {
        --bg-1: #0b1226;
        --bg-2: #050b1a;
        --cloud-1: rgba(37, 99, 235, 0.22);
        --cloud-2: rgba(14, 165, 233, 0.18);

        --primary: #38bdf8; /* sky-400 */
        --primary-600: #0ea5e9; /* sky-500 */
        --text: #eaf2ff;
        --muted: #a7b6d7;

        --wrap-bg: rgba(9, 14, 28, 0.45);
        --wrap-border: rgba(147, 197, 253, 0.18);

        --card: #0f172a; /* deep navy surface */
        --border: #1e293b;

        --input-bg: #111a2e;
        --input-border: #22324c;
        --input-placeholder: #a7b6d7;

        --heading: #dceaff;
        --status: #93c5fd;

        --shadow-lg: 0 30px 70px rgba(0, 0, 30, 0.55),
          0 12px 28px rgba(0, 0, 0, 0.35);
        --ring: 0 0 0 4px rgba(56, 189, 248, 0.28);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        color: var(--text);
        background: radial-gradient(
            1200px 800px at 75% 10%,
            var(--cloud-1),
            transparent 60%
          ),
          radial-gradient(
            1000px 900px at 10% 90%,
            var(--cloud-2),
            transparent 65%
          ),
          linear-gradient(180deg, var(--bg-1), var(--bg-2));
        overflow-x: hidden;
      }

      /* Soft animated clouds */
      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: -20%;
        background: radial-gradient(
            40% 35% at 20% 30%,
            rgba(255, 255, 255, 0.9),
            transparent 60%
          ),
          radial-gradient(
            45% 40% at 80% 25%,
            rgba(255, 255, 255, 0.8),
            transparent 60%
          ),
          radial-gradient(
            40% 35% at 65% 75%,
            rgba(255, 255, 255, 0.75),
            transparent 60%
          );
        filter: blur(40px) saturate(105%);
        opacity: 0.25;
        pointer-events: none;
        z-index: 0;
        animation: floaty 20s ease-in-out infinite alternate;
        mix-blend-mode: overlay;
      }
      :root[data-theme="dark"] body::before,
      :root[data-theme="dark"] body::after {
        opacity: 0.18;
        mix-blend-mode: screen;
      }
      body::after {
        animation-duration: 28s;
        opacity: 0.22;
      }
      @keyframes floaty {
        0% {
          transform: translate3d(-1%, -1%, 0) scale(1.02);
        }
        100% {
          transform: translate3d(1%, 1%, 0) scale(1.02);
        }
      }

      /* Layout */
      #container {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 56px 16px 60px;
        gap: 18px;
      }

      /* Theme toggle */
      .theme-toggle {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 5;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 999px;
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        cursor: pointer;

        font-weight: 600;
        font-size: 0.92rem;
      }
      .theme-toggle:focus-visible {
        outline: none;
        box-shadow: var(--ring);
      }
      .theme-toggle .icon {
        font-size: 1rem;
      }

      /* Brand */
      h1[title] {
        margin: 0;
        font-weight: 800;
        font-size: clamp(28px, 4.5vw, 44px);
        letter-spacing: 0.2px;
        background: linear-gradient(90deg, #0284c7, #38bdf8 50%, #93c5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 10px 30px rgba(2, 132, 199, 0.18);
      }

      /* Auth wrapper */
      #loginandregister {
        width: min(1000px, 94vw);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        background: var(--wrap-bg);
        border: 1px solid var(--wrap-border);
        padding: 10px;
        border-radius: 20px;

        box-shadow: 0 10px 30px rgba(2, 8, 23, 0.06);
      }

      /* Cards */
      #login,
      #register {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: clamp(18px, 2.8vw, 32px);
        box-shadow: var(--shadow-lg);
        transition: transform 0.18s ease, box-shadow 0.25s ease,
          border-color 0.18s ease;
      }
      #login:hover,
      #register:hover {
        transform: translateY(-2px);
        box-shadow: 0 30px 70px rgba(2, 132, 199, 0.12),
          0 10px 28px rgba(2, 8, 23, 0.08);
        border-color: var(--input-border);
      }

      h3[title],
      #register h3 {
        margin: 0 0 12px;
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--heading);
      }

      /* Forms */
      form {
        display: grid;
        gap: 12px;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 0.92rem;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        appearance: none;
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--input-border);
        border-radius: 12px;
        padding: 14px 14px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease,
          transform 0.06s ease;
        caret-color: var(--primary);
      }
      input::placeholder {
        color: var(--input-placeholder);
      }
      input:focus {
        border-color: var(--primary);
        box-shadow: var(--ring);
      }

      /* Buttons */
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        padding: 12px 16px;
        border-radius: 12px;
        font-weight: 800;
        letter-spacing: 0.2px;
        font-size: 0.98rem;
        color: #fff;
        background: linear-gradient(180deg, var(--primary), var(--primary-600));
        box-shadow: 0 10px 24px rgba(2, 132, 199, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        transition: transform 0.06s ease, filter 0.2s ease, box-shadow 0.2s ease;
      }
      button:hover {
        filter: brightness(1.05);
      }
      button:active {
        transform: translateY(1px) scale(0.99);
      }
      #submit {
        margin-top: 6px;
      }

      /* Helper/status text */
      #emailError,
      #Loginstatus,
      #Registrationstatus {
        display: block;
        min-height: 20px;
        font-size: 0.92rem;
        color: var(--status);
      }
      #emailError:empty,
      #Loginstatus:empty,
      #Registrationstatus:empty {
        min-height: 0;
      }

      /* Tasks panel */
      #tasks {
        width: min(1000px, 94vw);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 18px clamp(16px, 3vw, 24px);
        box-shadow: var(--shadow-lg);
      }
      #tasks h3 {
        margin: 0 0 8px;
        font-weight: 800;
        color: var(--heading);
      }
      #tasks ul {
        padding-left: 18px;
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      /* Responsive */
      @media (max-width: 900px) {
        #loginandregister {
          grid-template-columns: 1fr;
          padding: 0;
          background: transparent;
          border: none;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Theme toggle -->
    <button
      class="theme-toggle"
      id="themeToggle"
      aria-label="Toggle theme"
      aria-pressed="false"
    >
      <span class="icon" id="themeIcon">🌙</span>
      <span id="themeText">Dark</span>
    </button>

    <div id="container">
      <h1 title="newshub">Social Hub</h1>

      <div id="loginandregister">
        <div id="login">
          <h3 title="login">Login</h3>
          <form name="LoginForm">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="you@domain.com"
              maxlength="60"
            />
            <span id="emailError"></span>

            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Your password"
              maxlength="64"
            />
            <button type="submit" id="submit">Login</button>
          </form>
          <span id="Loginstatus"></span>
        </div>

        <div id="register">
          <h3>Register</h3>
          <form name="RegisterForm">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              id="fullname"
              placeholder="Jane Doe"
              maxlength="60"
            />

            <label for="emaail">Email</label>
            <input
              type="email"
              id="emaail"
              placeholder="you@domain.com"
              maxlength="60"
            />

            <label for="passwords">Password</label>
            <input
              type="password"
              id="passwords"
              placeholder="Min 6 characters"
              maxlength="64"
            />

            <label for="confirmpasswords">Confirm Password</label>
            <input
              type="password"
              id="confirmpasswords"
              placeholder="Re-enter password"
              maxlength="64"
            />

            <button type="submit">Register</button>
            <span id="Registrationstatus"></span>
          </form>
        </div>
      </div>

      <div id="tasks">
        <h3>Tasks we want to implement</h3>
        <ul>
          <li>Form Validation</li>
          <li>Prevent Duplicate Registration</li>
          <li>Redirect on success (Login → next page)</li>
          <li>Add debouncing to reduce calls on the server</li>
        </ul>
      </div>
    </div>

    <script>
      // Theme handling: system preference + persistence
      (function () {
        const root = document.documentElement;
        const toggle = document.getElementById("themeToggle");
        const icon = document.getElementById("themeIcon");
        const text = document.getElementById("themeText");

        const getSystemPref = () =>
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";

        const saved = localStorage.getItem("theme");
        const initial = saved || getSystemPref();
        applyTheme(initial);

        toggle.addEventListener("click", () => {
          const current =
            root.getAttribute("data-theme") === "dark" ? "dark" : "light";
          const next = current === "dark" ? "light" : "dark";
          applyTheme(next);
          localStorage.setItem("theme", next);
        });

        function applyTheme(theme) {
          root.setAttribute("data-theme", theme);
          const isDark = theme === "dark";
          toggle.setAttribute("aria-pressed", String(isDark));
          icon.textContent = isDark ? "☀️" : "🌙";
          text.textContent = isDark ? "Light" : "Dark";
        }

        // Live-update if system preference changes (when user has no explicit choice)
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        media.addEventListener?.("change", (e) => {
          if (!localStorage.getItem("theme"))
            applyTheme(e.matches ? "dark" : "light");
        });
      })();
    </script>
  </body>
</html>
